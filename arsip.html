<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARSIP DASHBOARD — LIVE</title>
<style>
  :root{
    --bg: #0c0d10;
    --bg-panel: #17181c;
    --bg-panel-2: #1e2025;
    --line: #2a2c32;
    --gold-1: #f3c969;
    --gold-2: #b8862f;
    --text: #f0ede4;
    --text-dim: #8b8d94;
    --red: #d9694f;
    --orange: #e0a44f;
    --amber: #c9b04f;
    --gray: #6b6d74;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 500px at 12% -10%, rgba(243,201,105,0.07), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Helvetica Neue', Arial, sans-serif;
    min-height:100vh;
  }
  .app{ display:flex; min-height:100vh; }

  /* ===== SIDEBAR ===== */
  .sidebar{
    width:285px; flex-shrink:0;
    background:var(--bg-panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column;
    height:100vh; position:sticky; top:0;
  }
  .sidebar-head{ padding:22px 18px 14px; border-bottom:1px solid var(--line); }
  .sidebar-head .eyebrow{
    font-size:13.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--gold-1); margin:0;
    display:flex; align-items:center; gap:7px;
  }
  .live-dot{ width:7px; height:7px; border-radius:50%; background:var(--good, #4fae6e); box-shadow:0 0 6px #4fae6e; }
  .live-dot.err{ background:var(--red); box-shadow:0 0 6px var(--red); }
  .sidebar-body{ flex:1; overflow-y:auto; display:flex; flex-direction:column; }
  .site-select-wrap{ padding:14px 16px; position:relative; }

  .custom-select{ position:relative; }
  .cs-trigger{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:#101115; border:1px solid var(--line); color:var(--text);
    padding:11px 12px; border-radius:8px; font-size:13.5px; text-align:left; cursor:pointer;
    font-family:inherit;
  }
  .cs-trigger:hover{ border-color:#3a3d45; }
  .custom-select.open .cs-trigger{ border-color:var(--gold-2); }
  .cs-trigger span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cs-caret{ flex-shrink:0; color:var(--text-dim); transition:transform .15s ease; }
  .custom-select.open .cs-caret{ transform:rotate(180deg); }

  .cs-dropdown{
    display:none; position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:50;
    background:#141519; border:1px solid var(--line); border-radius:10px;
    box-shadow:0 12px 28px rgba(0,0,0,0.45); overflow:hidden;
  }
  .custom-select.open .cs-dropdown{ display:block; }
  .cs-search{ padding:10px; border-bottom:1px solid var(--line); }
  .cs-search input{
    width:100%; background:#101115; border:1px solid var(--line); color:var(--text);
    padding:9px 11px; border-radius:7px; font-size:13px; outline:none;
  }
  .cs-search input:focus{ border-color:var(--gold-2); }
  .cs-options{ max-height:calc(100vh - 220px); overflow-y:auto; }
  .cs-option{
    padding:10px 14px; font-size:13px; color:var(--text); cursor:pointer;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .cs-option:hover{ background:rgba(243,201,105,0.08); }
  .cs-option.active{ background:rgba(243,201,105,0.12); color:var(--gold-1); }
  .cs-option.empty{ color:var(--text-dim); cursor:default; }
  .cs-option.empty:hover{ background:none; }

  .sidebar-foot{
    padding:14px 18px; border-top:1px solid var(--line);
    font-size:11px; color:var(--text-dim);
  }

  /* ===== MAIN ===== */
  main{ flex:1; padding:0 32px 60px; min-width:0; }
  .main-sticky{
    position:sticky; top:0; z-index:8; background:var(--bg); padding-top:28px; padding-bottom:4px;
  }
  .main-top{
    display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap;
    gap:16px; margin-bottom:22px;
  }
  .main-top h2{ margin:0 0 4px; font-family:'Georgia', serif; font-size:26px; color:var(--text); }
  .main-top-actions{ display:flex; align-items:center; gap:10px; }
  .refresh-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    background:var(--bg-panel-2); border:1px solid var(--line); color:var(--text-dim);
    padding:8px 14px; border-radius:8px; font-size:12px; font-family:inherit; cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .refresh-btn:hover{ border-color:var(--gold-2); color:var(--gold-1); }
  .refresh-btn:disabled{ opacity:.6; cursor:default; }
  .refresh-btn svg{ width:14px; height:14px; flex-shrink:0; transition:transform .2s ease; }
  .refresh-btn.spinning svg{ animation:spin 0.7s linear infinite; }
  .refresh-meta{ font-size:10.5px; color:var(--text-dim); }

  .stat-row{
    display:grid; grid-template-columns:repeat(3, 1fr);
    gap:14px; margin-bottom:24px;
  }
  .stat{
    background:linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
    border:1px solid var(--line); border-radius:10px; padding:15px 18px; position:relative; overflow:hidden;
  }
  .stat::before{ content:''; position:absolute; top:0; left:0; width:3px; height:100%; background:linear-gradient(180deg, var(--gold-1), var(--gold-2)); }
  .stat.warn::before{ background:linear-gradient(180deg, var(--orange), #8a5a2b); }
  .stat.bad::before{ background:linear-gradient(180deg, var(--red), #7a3423); }
  .stat .label{ font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-dim); margin-bottom:6px; }
  .stat .value{ font-size:24px; color:var(--text); font-family:'Georgia', serif; }
  .stat.warn .value{ color:var(--orange); }
  .stat.bad .value{ color:var(--red); }
  .stat.good .value{ color:var(--gold-1); }
  .stat.note::before{ background:linear-gradient(180deg, var(--amber), #6f6224); }
  .stat.note .value{ color:var(--amber); }

  .panel{ background:var(--bg-panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .panel.flat-top{ border-radius:0 0 12px 12px; }

  .staff-panel{ margin:0 16px 16px; border:1px solid rgba(255,255,255,0.28); }
  .staff-panel .stf-head{
    display:flex; align-items:center; gap:6px; background:#111318; padding:10px 14px; border-bottom:1px solid rgba(255,255,255,0.28);
    font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--gold-1); font-weight:700;
    cursor:pointer; user-select:none;
  }
  .staff-panel .stf-head:hover{ background:#15171c; }
  .staff-panel .stf-head::before{
    content:'▸'; font-size:9px; flex-shrink:0; transition:transform .15s ease; display:inline-block;
  }
  .staff-panel.open .stf-head::before{ transform:rotate(90deg); }
  .staff-panel .stf-head span:first-child{ flex:1; border-right:1px solid rgba(255,255,255,0.2); padding-right:8px; }
  .staff-panel .stf-head span:last-child{
    width:64px; flex-shrink:0; text-align:center; padding-left:6px; line-height:1.25; white-space:normal;
  }
  .staff-panel .stf-row{
    display:flex; align-items:stretch; padding:0; border-bottom:1px solid rgba(255,255,255,0.16);
    font-size:11.5px; color:#dedbd0;
  }
  .staff-panel .stf-row:hover{ background:rgba(243,201,105,0.05); }
  .staff-panel .stf-row:last-child{ border-bottom:none; }
  .staff-panel .stf-body{ display:none; }
  .staff-panel.open .stf-body{ display:block; }
  .staff-panel .stf-row span:first-child{
    flex:1; padding:8px 8px 8px 14px; border-right:1px solid rgba(255,255,255,0.16); word-break:break-word;
  }
  .staff-panel .stf-count{
    width:64px; flex-shrink:0; text-align:center; font-weight:700; color:var(--text-dim); font-family:'Georgia', serif;
    padding:8px 4px; display:flex; align-items:center; justify-content:center;
  }
  .staff-panel .stf-count.bad{ color:var(--orange); }

  .ref-col-head{
    display:flex; background:var(--bg-panel); border:1px solid var(--line); border-radius:12px 12px 0 0;
    border-bottom:none; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--text-dim); font-weight:600;
  }
  .ref-col-head span{ box-sizing:border-box; padding:8px 20px; }
  .ref-col-head span:nth-child(1){ width:6%; }
  .ref-col-head span:nth-child(2){ width:16%; }
  .ref-col-head span:nth-child(3){ flex:1; }

  .date-group{ border-bottom:1px solid var(--line); }
  .date-group:last-child{ border-bottom:none; }
  .date-head{
    background:#111318; padding:10px 20px; font-size:12px; letter-spacing:.08em;
    color:var(--gold-1); text-transform:uppercase; font-weight:600;
    display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none;
  }
  .date-head:hover{ background:#15171c; }
  .date-head::before{ content:'▸'; font-size:10px; transition:transform .15s ease; display:inline-block; }
  .log-group.open .date-head::before{ transform:rotate(90deg); }
  .log-group:not(.open) table{ display:none !important; }

  table{ width:100%; border-collapse:collapse; font-size:13.5px; table-layout:fixed; }
  thead.col-head th{
    text-align:left; padding:8px 20px; font-size:10.5px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--text-dim); font-weight:600; border-bottom:1px solid #202227;
  }
  tbody td{ padding:10px 20px; border-bottom:1px solid #1c1e23; color:#dedbd0; vertical-align:middle; }
  tbody tr:hover{ background:rgba(243,201,105,0.05); }
  tbody tr:last-child td{ border-bottom:none; }
  td.name{ font-weight:600; color:#f0ede4; }
  td.name .name-txt{
    display:block; max-width:15ch; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap;
  }
  /* Desktop lebar: tampilkan Nama / ID secara penuh, tidak terpotong */
  @media (min-width:1400px){
    td.name .name-txt{ max-width:none; overflow:visible; text-overflow:clip; }
  }
  td.link a{
    color:#7fb0d9; text-decoration:none; font-size:12.5px;
    display:inline-block; max-width:15ch; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; vertical-align:bottom;
  }
  td.link a:hover{ text-decoration:underline; }

  .status-pill{
    display:inline-flex; align-items:center; gap:6px;
    font-size:11.5px; padding:4px 10px; border-radius:20px; white-space:nowrap;
  }
  .status-pill .dot{ width:6px; height:6px; border-radius:50%; }
  .status-fatal{ background:rgba(217,105,79,0.14); color:var(--red); }
  .status-fatal .dot{ background:var(--red); }
  .status-noresp{ background:rgba(224,164,79,0.14); color:var(--orange); }
  .status-noresp .dot{ background:var(--orange); }
  .status-note{ background:rgba(201,176,79,0.13); color:var(--amber); }
  .status-note .dot{ background:var(--amber); }
  .status-neutral{ background:rgba(139,141,148,0.14); color:var(--text-dim); }
  .status-neutral .dot{ background:var(--gray); }

  .empty{ padding:60px 20px; text-align:center; color:var(--text-dim); line-height:1.6; }
  .empty b{ color:var(--text); }
  .spin{
    width:26px; height:26px; border-radius:50%; border:2px solid #2c2e34; border-top-color:var(--gold-1);
    animation:spin 0.8s linear infinite; margin:0 auto 14px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ===== TABLET / MOBILE (<=820px) ===== */
  @media (max-width:820px){
    body{ overflow-x:hidden; }
    .app{ flex-direction:column; }
    .sidebar{ width:100%; height:auto; position:relative; border-right:none; border-bottom:1px solid var(--line); }
    .sidebar-body{ flex:none; overflow:visible; }
    .staff-panel{ margin:0 14px 14px; }
    .staff-panel .stf-body{ max-height:260px; }
    main{ padding:0 16px 24px; }
    .main-sticky{ padding-top:16px; padding-bottom:2px; }
    .main-top h2{ font-size:21px; }
    .stat-row{ gap:10px; margin-bottom:18px; }
    .stat{ padding:12px 14px; }
    .stat .value{ font-size:20px; }
    .date-head{ padding:9px 16px; }

    table, thead, tbody, th, td, tr{ display:block; }
    thead.col-head{ display:none; }
    .ref-col-head{ display:none !important; }
    .panel.flat-top{ border-radius:12px; }
    tbody tr{ padding:12px 16px; border-bottom:1px solid var(--line); }
    td{ padding:5px 0 !important; border:none !important; }
    td.name{ font-size:14px; }
    td.name .name-txt{
      display:block; max-width:none; overflow:visible;
      text-overflow:clip; white-space:normal; word-break:break-word;
    }
    td.link, td:last-child{ display:flex; align-items:center; gap:8px; }
    td.link a{
      flex:1; min-width:0; max-width:none; display:block;
      overflow:visible; text-overflow:clip; white-space:normal; overflow-wrap:break-word;
    }
    .status-pill{ white-space:normal; }
    td[data-label]::before{
      content:attr(data-label); flex-shrink:0; width:64px;
      font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-dim);
    }
    td.name::before{ display:none; }
    .no-cell{ display:none; }
  }

  /* ===== PHONE (<=480px) ===== */
  @media (max-width:480px){
    .sidebar-head{ padding:18px 14px 12px; }
    .sidebar-head .eyebrow{ font-size:11px; }
    .site-select-wrap{ padding:10px 14px; }
    .staff-panel{ margin:0 10px 10px; }
    .staff-panel .stf-row span:first-child{ padding:7px 6px 7px 12px; font-size:11px; }
    .staff-panel .stf-count{ width:52px; font-size:11px; }
    main{ padding:0 12px 20px; }
    .stat-row{ gap:8px; }
    .stat{ padding:10px 10px; }
    .stat .label{ font-size:9px; }
    .stat .value{ font-size:18px; }
    td[data-label]::before{ width:52px; }
  }

  ::-webkit-scrollbar{ width:9px; }
  ::-webkit-scrollbar-thumb{ background:#2c2e34; border-radius:6px; }
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="sidebar-head">
      <p class="eyebrow"><span class="live-dot" id="liveDot"></span> Arsip Report · Live</p>
    </div>
    <div class="sidebar-body">
      <div class="site-select-wrap">
        <div class="custom-select" id="customSelect">
          <button type="button" class="cs-trigger" id="csTrigger">
            <span id="csTriggerLabel">Memuat daftar situs...</span>
            <svg class="cs-caret" width="11" height="7" viewBox="0 0 11 7" fill="none">
              <path d="M1 1L5.5 5.5L10 1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="cs-dropdown" id="csDropdown">
            <div class="cs-search">
              <input id="siteSearch" type="text" placeholder="Cari situs...">
            </div>
            <div class="cs-options" id="csOptions"></div>
          </div>
        </div>
      </div>
      <div class="panel staff-panel" id="staffPanel">
        <div class="empty" style="padding:24px;">—</div>
      </div>
    </div>
  </aside>

  <main>
    <div class="main-sticky">
      <div class="main-top">
        <div>
          <h2 id="activeSiteTitle">—</h2>
          <div class="refresh-meta" id="refreshMeta"></div>
        </div>
        <div class="main-top-actions">
          <button type="button" class="refresh-btn" id="refreshBtn" title="Tarik ulang data tab ini sekarang">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
            </svg>
            <span>Refresh</span>
          </button>
        </div>
      </div>

      <div class="stat-row" id="statRow"></div>

      <div class="ref-col-head" id="refColHead" style="display:none;">
        <span style="width:6%;">No</span>
        <span style="width:16%;">Kategori</span>
        <span style="padding-left:104px;">Poin Kesalahan</span>
      </div>
    </div>

    <div class="panel" id="resultPanel">
      <div class="empty"><div class="spin"></div>Menghubungkan ke spreadsheet...</div>
    </div>
  </main>

</div>

<script>
/* =========================================================
   KONFIGURASI — terhubung langsung ke spreadsheet aslinya
   ========================================================= */
  const SPREADSHEET_ID = "16AJAjj2Er9-qkkvWyO9F9LoaYUESAzOcpk5e7nyR2gg";
  const API_KEY = "AIzaSyBRNBQxfptX2-BF1gJ3eqVNMFi8ne63Qv0";
  // Kolom tempat data log berada di tiap tab/sheet (D=Nama, E=Link, F=Status),
  // sesuai posisi kolom di spreadsheet ARSIP kamu. Ubah di sini kalau posisinya beda.
  const DATA_RANGE = "D1:F2000";
  // Nama tab yang BUKAN situs (halaman rekap/poin), staff-panel disembunyikan untuk tab ini
  const STAFF_PANEL_EXCLUDE = ["poin-poin kesalahan lc new", "total kesalahan"];

  const el = id => document.getElementById(id);
  let SHEET_TABS = [];              // daftar nama tab, urut sesuai spreadsheet
  let SITE_DATA = {};               // cache: { tabName: { date: [records] } }
  let activeSite = null;
  let loadingSet = new Set();

  // ---- Cache lokal (localStorage) — supaya saat halaman di-refresh (F5), dashboard
  // langsung tampil dari data terakhir yang tersimpan (instan), sambil diam-diam
  // menarik data terbaru dari spreadsheet di belakang layar untuk menimpanya. ----
  const LS_PREFIX = `arsip_live_${SPREADSHEET_ID}_`;
  function lsSave(key, data){
    try{ localStorage.setItem(LS_PREFIX + key, JSON.stringify({ t: Date.now(), data })); }catch(e){}
  }
  function lsLoad(key){
    try{
      const raw = localStorage.getItem(LS_PREFIX + key);
      if(!raw) return null;
      const parsed = JSON.parse(raw);
      return parsed ? parsed : null;
    }catch(e){ return null; }
  }

  function setLive(ok){
    el('liveDot').className = 'live-dot' + (ok ? '' : ' err');
  }

  function setRefreshMeta(text){
    el('refreshMeta').textContent = text || '';
  }

  function isReferenceSite(siteName){
    return STAFF_PANEL_EXCLUDE.includes(siteName.trim().toLowerCase());
  }
  function isStickyHeaderSite(siteName){
    return ['total kesalahan', 'poin-poin kesalahan lc new'].includes(siteName.trim().toLowerCase());
  }

  // ---- Fetch yang selalu ambil data terbaru dari server, tidak pernah dari cache HTTP
  // browser (penting di HP — Chrome/Safari mobile kadang menyimpan cache respons GET
  // yang sama walau halamannya sendiri sudah di-refresh). Catatan: JANGAN tambahkan
  // parameter query buatan sendiri (mis. _ts) di URL ini — Google Sheets API menolak
  // parameter yang tidak dikenal dengan error "Invalid JSON payload" / "Unknown name". ----
  function freshFetch(url){
    return fetch(url, { cache: 'no-store' });
  }

  // ---- Ambil daftar semua tab/sheet dalam spreadsheet (ini yang jadi sidebar) ----
  async function fetchSheetTabs(){
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}?fields=sheets.properties.title&key=${API_KEY}`;
    const res = await freshFetch(url);
    if(!res.ok){
      const body = await res.text().catch(()=> '');
      throw new Error(`HTTP ${res.status} ${body.slice(0,160)}`);
    }
    const json = await res.json();
    const tabs = (json.sheets || []).map(s => s.properties.title);
    lsSave('tabs', tabs);
    return tabs;
  }

  // ---- Ambil data D:F dari satu tab tertentu, lalu susun jadi grup per tanggal ----
  function isDateLike(s){
    return /^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test((s||'').trim());
  }
  function isUrlLike(s){
    return /^https?:\/\//i.test((s||'').trim());
  }
  function statusFromNote(note){
    const n = (note||'').toLowerCase();
    if(n.includes('note')) return 'note';
    return 'noresp';
  }

  async function fetchSiteData(siteName, force=false){
    if(!force && SITE_DATA[siteName]) return SITE_DATA[siteName];
    const range = `'${siteName.replace(/'/g,"''")}'!${DATA_RANGE}`;
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}?key=${API_KEY}`;
    const res = await freshFetch(url);
    if(!res.ok){
      const body = await res.text().catch(()=> '');
      throw new Error(`HTTP ${res.status} ${body.slice(0,160)}`);
    }
    const json = await res.json();
    const rows = json.values || [];

    const groups = {};
    let currentDate = null;
    rows.forEach(r => {
      const name = (r[0] || '').trim();
      const linkOrDate = (r[1] || '').trim();
      const status = (r[2] || '').trim();

      // Baris pemisah tanggal: nama & status kosong, kolom link berisi tanggal (mis. 01/07/2026)
      if(!name && !status && isDateLike(linkOrDate)){
        currentDate = linkOrDate;
        if(!groups[currentDate]) groups[currentDate] = [];
        return;
      }
      // Baris data biasa
      if(name && (linkOrDate || status)){
        if(!currentDate){ currentDate = '(Tanpa tanggal)'; }
        if(!groups[currentDate]) groups[currentDate] = [];
        groups[currentDate].push({
          name,
          link: isUrlLike(linkOrDate) ? linkOrDate : '',
          note: status || (isUrlLike(linkOrDate) ? '—' : linkOrDate) || '—',
          status: statusFromNote(status)
        });
      }
    });

    SITE_DATA[siteName] = groups;
    lsSave('site:' + siteName, groups);
    return groups;
  }

  function countRecords(groups){
    if(!groups) return 0;
    return Object.values(groups).reduce((sum, arr) => sum + arr.length, 0);
  }

  function renderSiteList(filter=''){
    const q = filter.trim().toLowerCase();
    const list = SHEET_TABS.filter(s => s.toLowerCase().includes(q));
    const optionsBox = el('csOptions');
    if(!list.length){
      optionsBox.innerHTML = `<div class="cs-option empty">Tidak ada situs yang cocok</div>`;
      return;
    }
    optionsBox.innerHTML = list.map(s => {
      const count = SITE_DATA[s] ? countRecords(SITE_DATA[s]) : null;
      const label = count === null ? s : `${s} (${count})`;
      return `<div class="cs-option ${s===activeSite?'active':''}" data-site="${s.replace(/"/g,'&quot;')}">${label}</div>`;
    }).join('');
  }

  function updateTriggerLabel(){
    const count = activeSite && SITE_DATA[activeSite] ? countRecords(SITE_DATA[activeSite]) : null;
    el('csTriggerLabel').textContent = activeSite
      ? (count === null ? activeSite : `${activeSite} (${count})`)
      : 'Pilih situs...';
  }

  function openCsDropdown(){
    el('customSelect').classList.add('open');
    el('siteSearch').value = '';
    renderSiteList('');
    el('siteSearch').focus();
  }
  function closeCsDropdown(){
    el('customSelect').classList.remove('open');
  }

  function statusMeta(status){
    switch(status){
      case 'note': return { cls:'status-note' };
      default: return { cls:'status-noresp' };
    }
  }

  function renderStats(records){
    const total = records.length;
    const noresp = records.filter(r=>r.status==='noresp').length;
    const note = records.filter(r=>r.status==='note').length;
    el('statRow').innerHTML = `
      <div class="stat"><div class="label">Total Laporan</div><div class="value">${total}</div></div>
      <div class="stat warn"><div class="label">Tidak Respon</div><div class="value">${noresp}</div></div>
      <div class="stat note"><div class="label">Note</div><div class="value">${note}</div></div>
    `;
  }

  // ---- Rekap "Total Kesalahan" per nama staff = jumlah status yang BUKAN "note" ----
  function aggregateStaff(records){
    const map = new Map();
    records.forEach(r => {
      if(!map.has(r.name)) map.set(r.name, 0);
      if(r.status === 'noresp') map.set(r.name, map.get(r.name) + 1);
    });
    return Array.from(map.entries()).map(([name, count]) => ({ name, count }));
  }

  const isDesktopView = () => window.matchMedia('(min-width:821px)').matches;

  function renderStaffPanel(records){
    const staff = aggregateStaff(records);
    const rows = staff.map(s => `<div class="stf-row">
        <span>${s.name}</span>
        <span class="stf-count ${s.count > 0 ? 'bad' : ''}">${s.count}</span>
      </div>`).join('');
    el('staffPanel').innerHTML = `
      <div class="stf-head"><span>Nama Staff</span><span>Total Kesalahan</span></div>
      <div class="stf-body">${rows || '<div class="empty" style="padding:24px;">Belum ada data.</div>'}</div>
    `;
    // Desktop: langsung tampil terbuka saat pasaran dipilih. Mobile: tetap dropdown (tertutup).
    el('staffPanel').classList.toggle('open', isDesktopView());
  }

  // ---- Untuk tab REFERENSI (mis. "poin-poin kesalahan lc new"): bukan log Nama/Link/Status,
  //      tapi daftar Kategori (D) > Poin Kesalahan (E) > Keterangan (F) ----
  async function fetchReferenceData(siteName, force=false){
    if(!force && SITE_DATA[siteName]) return SITE_DATA[siteName];
    const range = `'${siteName.replace(/'/g,"''")}'!${DATA_RANGE}`;
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}?key=${API_KEY}`;
    const res = await freshFetch(url);
    if(!res.ok){
      const body = await res.text().catch(()=> '');
      throw new Error(`HTTP ${res.status} ${body.slice(0,160)}`);
    }
    const json = await res.json();
    const rows = json.values || [];

    const groups = [];
    let current = null;
    rows.forEach(r => {
      const d = (r[0] || '').trim();
      const e = (r[1] || '').trim();
      const f = (r[2] || '').trim();

      if(!d && !e && !f) return; // baris kosong pemisah, lewati

      // Baris berisi link spreadsheet (mis. link ke Google Sheets di kolom E) — lewati,
      // data mulai diambil dari baris berikutnya.
      if(isUrlLike(e) && /docs\.google\.com\/spreadsheets/i.test(e)) return;

      // Kolom D terisi = mulai kategori baru. Kadang kategori berdiri sendiri
      // (SALAH RESPON, FATAL, DURASI), kadang digabung dengan poin pertamanya
      // di baris yang sama (SS ADMIN + TURNOVER, SPAM + ..., dst) — keduanya ditangani di sini.
      if(d){
        current = { title: d, items: [] };
        groups.push(current);
        if(e) current.items.push({ point: e, note: f });
        return;
      }
      // Baris lanjutan: kolom D kosong tapi E terisi = poin di bawah kategori aktif
      if(e){
        if(!current){ current = { title:'', items:[] }; groups.push(current); }
        current.items.push({ point: e, note: f });
      }
    });

    SITE_DATA[siteName] = groups;
    lsSave('ref:' + siteName, groups);
    return groups;
  }

  function renderReferenceList(groups, siteName, hideThead){
    if(!groups.length){
      return `<div class="empty">Belum ada data di tab <b>${siteName}</b>.</div>`;
    }
    let html = '';
    let no = 0;
    groups.forEach(g => {
      if(!g.items.length) return; // lewati kategori kosong (mis. judul sheet di baris pertama)
      no++;
      html += `<div class="date-group">
        <table>
          <colgroup>
            <col class="no-col" style="width:6%;">
            <col style="width:16%;">
            <col>
          </colgroup>
          ${hideThead ? '' : `<thead class="col-head"><tr>
            <th class="no-cell" style="width:6%;">No</th>
            <th style="width:16%;">Kategori</th>
            <th style="padding-left:104px;">Poin Kesalahan</th>
          </tr></thead>`}
          <tbody>`;
      g.items.forEach((it, idx) => {
        const catHtml = idx === 0 ? (g.title || '—') : '';
        const noHtml = idx === 0 ? no : '';
        const noAttr = idx === 0 ? ` data-no="${no}"` : '';
        html += `<tr>
          <td class="no-cell" style="white-space:normal; color:var(--gold-1);">${noHtml}</td>
          <td class="name"${noAttr} style="white-space:normal; max-width:none; color:var(--gold-1);">${catHtml}</td>
          <td style="white-space:normal; padding-left:104px;">${it.point}</td>
        </tr>`;
      });
      html += `</tbody></table></div>`;
    });
    return html || `<div class="empty">Belum ada data di tab <b>${siteName}</b>.</div>`;
  }

  // ---- Gambar ulang isi panel dari data yang SUDAH ADA di SITE_DATA (tanpa fetch).
  // Dipakai baik setelah fetch selesai, maupun untuk menampilkan cache secara instan. ----
  function renderSiteContent(siteName){
    const isReference = isReferenceSite(siteName);
    const isStickyHeaderTab = isStickyHeaderSite(siteName);
    el('staffPanel').style.display = isReference ? 'none' : '';
    el('refColHead').style.display = isStickyHeaderTab ? 'flex' : 'none';
    el('resultPanel').classList.toggle('flat-top', isStickyHeaderTab);

    if(isReference){
      const groups = SITE_DATA[siteName] || [];
      el('resultPanel').innerHTML = renderReferenceList(groups, siteName, isStickyHeaderTab);
      return;
    }

    const groups = SITE_DATA[siteName] || {};
    const allRecords = Object.values(groups).flat();
    if(!allRecords.length){
      el('statRow').innerHTML = '';
      el('staffPanel').innerHTML = '';
      el('resultPanel').innerHTML = `<div class="empty"></div>`;
      return;
    }

    // Simpan grup tanggal & panel staff yang sedang dibuka user, supaya refresh
    // (manual atau otomatis) tidak menutup ulang apa yang lagi mereka lihat.
    const openDates = new Set(
      Array.from(el('resultPanel').querySelectorAll('.log-group.open .date-head')).map(h => h.textContent)
    );
    const staffTouched = el('staffPanel').dataset.touched === '1';
    const staffWasOpen = el('staffPanel').classList.contains('open');

    renderStats(allRecords);
    renderStaffPanel(allRecords);
    if(staffTouched){
      el('staffPanel').classList.toggle('open', staffWasOpen);
    }

    let html = '';
    const dateEntries = Object.entries(groups).filter(([, records]) => records.length).reverse();
    dateEntries.forEach(([date, records], idx) => {
      const isOpen = openDates.size ? openDates.has(date) : idx === 0;
      html += `<div class="date-group log-group${isOpen ? ' open' : ''}">
        <div class="date-head">${date}</div>
        <table>
          <thead class="col-head"><tr>
            <th style="width:30%;">Nama / ID</th>
            <th style="width:26%;">Link</th>
            <th>Status</th>
          </tr></thead>
          <tbody>`;
      records.forEach(r => {
        const meta = statusMeta(r.status);
        const linkHtml = r.link ? `<a href="${r.link}" target="_blank" rel="noopener" title="${r.link}">${r.link}</a>` : '—';
        html += `<tr>
          <td class="name" data-label="Nama / ID"><span class="name-txt" title="${r.name}">${r.name}</span></td>
          <td class="link" data-label="Link">${linkHtml}</td>
          <td data-label="Status"><span class="status-pill ${meta.cls}"><span class="dot"></span>${r.note}</span></td>
        </tr>`;
      });
      html += `</tbody></table></div>`;
    });
    el('resultPanel').innerHTML = html || `<div class="empty">Tidak ada data untuk ditampilkan.</div>`;
  }

  async function selectSite(siteName, opts={}){
    const forceFresh = !!opts.force;
    activeSite = siteName;
    el('activeSiteTitle').textContent = siteName;
    updateTriggerLabel();
    closeCsDropdown();
    renderSiteList(el('siteSearch').value);
    el('staffPanel').removeAttribute('data-touched');

    const isReference = isReferenceSite(siteName);
    const isStickyHeaderTab = isStickyHeaderSite(siteName);
    el('staffPanel').style.display = isReference ? 'none' : '';
    el('refColHead').style.display = isStickyHeaderTab ? 'flex' : 'none';
    el('resultPanel').classList.toggle('flat-top', isStickyHeaderTab);

    const cached = SITE_DATA[siteName];
    if(cached){
      // Sudah ada data (dari sesi ini atau cache lokal) → langsung tampil, tidak nge-blank,
      // sambil tetap menarik data terbaru di belakang layar (lihat forceFresh di bawah).
      el('statRow').innerHTML = '';
      renderSiteContent(siteName);
    } else {
      el('statRow').innerHTML = '';
      el('staffPanel').innerHTML = '';
      el('resultPanel').innerHTML = `<div class="empty"><div class="spin"></div>Menarik data dari tab "${siteName}"...</div>`;
    }

    try{
      if(isReference){
        await fetchReferenceData(siteName, forceFresh);
      } else {
        await fetchSiteData(siteName, forceFresh);
        renderSiteList(el('siteSearch').value); // update count badge
        updateTriggerLabel();
      }
      renderSiteContent(siteName);
      setLive(true);
      setRefreshMeta('Diperbarui ' + new Date().toLocaleTimeString('id-ID'));
    } catch(err){
      console.error(err);
      setLive(false);
      if(!cached){
        el('statRow').innerHTML = '';
        el('staffPanel').innerHTML = '';
        el('resultPanel').innerHTML = `<div class="empty">
          Gagal menarik data dari tab <b>${siteName}</b>.<br>${err.message}<br><br>
          <span style="font-size:12px;">Pastikan nama tab di spreadsheet persis sama, sheet dapat diakses publik
          ("Anyone with the link can view"), dan API key tidak dibatasi domain.</span>
        </div>`;
      }
    }
  }

  // ---- Refresh instan: tarik ulang HANYA tab yang sedang aktif (satu request kecil),
  // tanpa mengambil ulang daftar tab dan tanpa menghapus tampilan lama sampai data
  // baru benar-benar siap — jadi terasa instan dan tidak "blank" seperti reload halaman. ----
  async function refreshActiveSite(){
    if(!activeSite) return;
    const btn = el('refreshBtn');
    btn.classList.add('spinning');
    btn.disabled = true;
    try{
      if(isReferenceSite(activeSite)){
        await fetchReferenceData(activeSite, true);
      } else {
        await fetchSiteData(activeSite, true);
        renderSiteList(el('siteSearch').value);
        updateTriggerLabel();
      }
      renderSiteContent(activeSite);
      setLive(true);
      setRefreshMeta('Diperbarui ' + new Date().toLocaleTimeString('id-ID'));
    } catch(err){
      console.error(err);
      setLive(false);
      setRefreshMeta('Gagal memperbarui — coba lagi');
    } finally{
      btn.classList.remove('spinning');
      btn.disabled = false;
    }
  }
  el('refreshBtn').addEventListener('click', refreshActiveSite);

  async function init(){
    // 1) Tampilkan dulu dari cache lokal (kalau ada) — instan, tanpa menunggu network sama sekali.
    const cachedTabs = lsLoad('tabs');
    if(cachedTabs && cachedTabs.data && cachedTabs.data.length){
      SHEET_TABS = cachedTabs.data;
      renderSiteList();
      const firstSite = SHEET_TABS[0];
      const cachedSite = lsLoad('site:' + firstSite) || lsLoad('ref:' + firstSite);
      if(cachedSite){
        activeSite = firstSite;
        SITE_DATA[firstSite] = cachedSite.data;
        el('activeSiteTitle').textContent = firstSite;
        updateTriggerLabel();
        setRefreshMeta('Menampilkan data tersimpan, memperbarui...');
        renderSiteContent(firstSite);
      }
    }

    // 2) Lalu diam-diam tarik data terbaru dari spreadsheet dan timpa tampilan di atas.
    try{
      const freshTabs = await fetchSheetTabs();
      if(!freshTabs.length) throw new Error('Tidak ada tab ditemukan di spreadsheet ini');
      SHEET_TABS = freshTabs;
      setLive(true);
      renderSiteList();
      const targetSite = (activeSite && freshTabs.includes(activeSite)) ? activeSite : freshTabs[0];
      // force:true → walau ada data cache lokal yang barusan ditampilkan, tetap PASTI
      // tarik ulang dari server (bukan cuma dipakai apa adanya), supaya pertama kali
      // buka dashboard / refresh (termasuk di HP) selalu dapat data terbaru.
      await selectSite(targetSite, { force: true });
    } catch(err){
      console.error(err);
      setLive(false);
      if(!activeSite){
        el('csTriggerLabel').textContent = 'Gagal memuat daftar tab';
        el('csOptions').innerHTML = `<div class="cs-option empty">Gagal memuat daftar tab</div>`;
        el('resultPanel').innerHTML = `<div class="empty">
          Tidak bisa terhubung ke spreadsheet.<br><br>
          <span style="font-size:12px; color:var(--red);">${(err && err.message) ? err.message : 'Unknown error'}</span><br><br>
          <span style="font-size:12px;">Pastikan spreadsheet di-set "Anyone with the link can view",
          API key aktif untuk Google Sheets API di Google Cloud Console, dan (kalau dashboard ini dipasang
          di dalam iframe/situs lain) domain situs tersebut sudah diizinkan di pembatasan
          HTTP referrer API key-nya.</span>
        </div>`;
      } else {
        setRefreshMeta('Menampilkan data tersimpan (gagal terhubung ke server)');
      }
    }
  }

  el('siteSearch').addEventListener('input', e => renderSiteList(e.target.value));
  el('siteSearch').addEventListener('click', e => e.stopPropagation());
  el('csTrigger').addEventListener('click', e => {
    e.stopPropagation();
    el('customSelect').classList.contains('open') ? closeCsDropdown() : openCsDropdown();
  });
  el('csOptions').addEventListener('click', e => {
    const opt = e.target.closest('.cs-option[data-site]');
    if(opt) selectSite(opt.getAttribute('data-site'));
  });
  document.addEventListener('click', e => {
    if(!el('customSelect').contains(e.target)) closeCsDropdown();
  });
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape') closeCsDropdown();
  });

  // Buka/tutup grup tanggal dengan klik pada headernya (accordion)
  el('resultPanel').addEventListener('click', e => {
    const head = e.target.closest('.date-head');
    if(head) head.closest('.date-group').classList.toggle('open');
  });

  // Buka/tutup daftar "Nama Staff / Total Kesalahan" dengan klik pada headernya
  el('staffPanel').addEventListener('click', e => {
    if(e.target.closest('.stf-head')){
      el('staffPanel').classList.toggle('open');
      el('staffPanel').dataset.touched = '1';
    }
  });

  init();
</script>
</body>
</html>
