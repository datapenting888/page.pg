<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keep</title>
<style>
  :root{
    --border-soft: rgba(255,255,255,0.08);
    --text-primary: #e8ecf3;
    --text-secondary: #9aa4b2;
  }
  html, body{
    margin:0;
    padding:0;
    height:100%;
    background:#0a0d1a;
    color:var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .keep-wrap{
    box-sizing:border-box;
    width:100%;
    min-height:100%;
    padding:20px;
  }
  .keep-empty{
    color:var(--text-secondary);
    margin:0;
    font-size:14px;
  }
</style>
</head>
<body>
  <div class="keep-wrap">
    <!--
      Konten menu "KEEP" ditulis di sini. File ini ditampilkan lewat
      iframe di dalam index.html (menu "KEEP" pada sidebar), mengikuti
      pola yang sama seperti arsip.html / generate-password.html /
      harian-dashboard.html. Untuk mengubah isi menu KEEP, cukup edit
      file ini — TIDAK perlu mengubah index.html.
    -->
    <p class="keep-empty">Konten menu KEEP belum diisi.</p>
  </div>
</body>
</html>
